# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=foodapp_user
spring.datasource.password=foodapp_password
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your_jwt_secret_key_here_min_256_bits_long
jwt.expiration=86400000

# Stripe Payment Configuration
stripe.api.key=sk_test_your_stripe_key
stripe.api.public.key=pk_test_your_public_key

# Application Configuration
spring.application.name=Food-Ordering-App
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging
logging.level.root=INFO
logging.level.com.foodapp=DEBUG
